version: '3.8'

# Вариант с использованием существующей БД n8n
services:
  # Telegram бот (без своей БД)
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OKDESK_API_TOKEN=${OKDESK_API_TOKEN}
      - OKDESK_BASE_URL=${OKDESK_BASE_URL}
      - OKDESK_WEBHOOK_SECRET=${OKDESK_WEBHOOK_SECRET}
      # Используем БД от n8n
      - DB_HOST=${N8N_DB_HOST}
      - DB_PORT=${N8N_DB_PORT}
      - DB_NAME=${N8N_DB_NAME}
      - DB_USER=${N8N_DB_USER}
      - DB_PASSWORD=${N8N_DB_PASSWORD}
      - WEBHOOK_ENABLED=true
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"
    restart: unless-stopped
    command: python main.py
    networks:
      - n8n-net

networks:
  n8n-net:
    external: true
