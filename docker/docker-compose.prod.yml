services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine  # Alpine версия меньше по размеру
    container_name: okypbot_postgres
    environment:
      POSTGRES_DB: okypbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/var/lib/postgresql/backup
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okypbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Используем стандартную конфигурацию PostgreSQL

  # Telegram бот + Webhook сервер
  bot:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
      target: production  # multi-stage build
    image: okypbot:${VERSION:-latest}
    container_name: okypbot_app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OKDESK_API_TOKEN=${OKDESK_API_TOKEN}
      - OKDESK_BASE_URL=${OKDESK_BASE_URL}
      - OKDESK_WEBHOOK_SECRET=${OKDESK_WEBHOOK_SECRET}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=okypbot
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - WEBHOOK_ENABLED=true
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
      - ADMIN_IDS=${ADMIN_IDS}
      # Оптимизация Python
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONHASHSEED=random
      - PIP_NO_CACHE_DIR=1
      - PIP_DISABLE_PIP_VERSION_CHECK=1
    volumes:
      - type: bind
        source: ${PWD}/ml
        target: /app/ml
      - type: bind
        source: ${PWD}/bot_model
        target: /app/bot_model
        read_only: true
      - type: volume
        source: ml_backups
        target: /app/ml/models/backups
      - type: volume
        source: ml_cache
        target: /app/ml/models/cache
      - type: volume
        source: bot_logs
        target: /app/logs
      - type: volume
        source: bot_data
        target: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    # Избегаем privileged режима
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  # nginx прокси
  nginx:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
    container_name: okypbot_nginx
    ports:
      - "8080:80"  # меняем внешний порт на 8080
      - "8443:443"  # меняем внешний порт на 8443
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  postgres_data:
    driver: local
  postgres_backup:
    driver: local
  ml_backups:
    driver: local
  ml_cache:
    driver: local
  bot_logs:
    driver: local
  bot_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  okypbot-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: okypbot-br
    ipam:
      config:
        - subnet: 172.20.0.0/16