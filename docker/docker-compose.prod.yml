services:
  # PostgreSQL база данных (отдельный контейнер)
  postgres:
    image: postgres:15
    container_name: okypbot_postgres
    environment:
      POSTGRES_DB: okypbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Оптимизация для надежности
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      # Настройки для надежности
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 768MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/var/lib/postgresql/backup
    ports:
      - "5433:5432"  # Публичный порт для удаленного доступа
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okypbot"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # Конфигурация для автоматического бэкапа
    command: |
      bash -c '
        echo "0 3 * * * postgres pg_dump -U postgres okypbot > /var/lib/postgresql/backup/okypbot_\$(date +\%Y\%m\%d).sql" >> /etc/cron.d/postgres-backup
        service cron start
        docker-entrypoint.sh postgres'

  # Telegram бот + Webhook сервер (отдельный контейнер)
  bot:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: okypbot_app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OKDESK_API_TOKEN=${OKDESK_API_TOKEN}
      - OKDESK_BASE_URL=${OKDESK_BASE_URL}
      - OKDESK_WEBHOOK_SECRET=${OKDESK_WEBHOOK_SECRET}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=okypbot
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - WEBHOOK_ENABLED=true
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
      - ADMIN_IDS=${ADMIN_IDS}
    volumes:
      - ml_models:/app/ml/models:rw
      - ml_backups:/app/ml/models/backups:rw
      - ml_cache:/app/ml/models/cache:rw
      - bot_logs:/app/logs:rw
      - bot_data:/app/data:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx прокси для webhook endpoints
  nginx:
    image: nginx:alpine
    container_name: okypbot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: okypbot_postgres_data
  postgres_backup:
    name: okypbot_postgres_backup
  nginx_logs:
    driver: local
  ml_models:
    driver: local
  ml_backups:
    driver: local
  ml_cache:
    driver: local
  bot_logs:
    driver: local
  bot_data:
    driver: local

networks:
  okypbot-net:
    driver: bridge
