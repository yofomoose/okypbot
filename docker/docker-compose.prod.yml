services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine  # Alpine версия меньше по размеру
    container_name: okypbot_postgres
    environment:
      POSTGRES_DB: okypbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/var/lib/postgresql/backup
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okypbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Используем стандартную конфигурацию PostgreSQL

  # Telegram бот + Webhook сервер
  bot:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
      target: production  # multi-stage build
    image: okypbot:${VERSION:-latest}
    container_name: okypbot_app
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OKDESK_API_TOKEN: ${OKDESK_API_TOKEN}
      OKDESK_BASE_URL: ${OKDESK_BASE_URL}
      OKDESK_WEBHOOK_SECRET: ${OKDESK_WEBHOOK_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: okypbot
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      WEBHOOK_ENABLED: 'true'
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8000
      ADMIN_IDS: ${ADMIN_IDS}
      # Оптимизация Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONHASHSEED: random
      PIP_NO_CACHE_DIR: 1
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      PYTHONPATH: /app
    command: python main.py
    volumes:
      - ml_data:/app/ml
      - bot_logs:/app/logs
      - bot_data:/app/data
      - database_data:/app/database
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    # Избегаем privileged режима
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  # nginx прокси
  nginx:
    image: nginx:alpine
    container_name: okypbot_nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bot
    networks:
      - okypbot-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  postgres_backup:
  ml_data:
  bot_logs:
  bot_data:
  database_data:
  nginx_logs:

networks:
  okypbot-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: okypbot-br
    ipam:
      config:
        - subnet: 172.20.0.0/16