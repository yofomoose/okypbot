upstream okypbot_backend {
    server bot:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    
    # Access log format
    access_log /var/log/nginx/okypbot.access.log main;
    error_log /var/log/nginx/okypbot.error.log warn;

    # Health check endpoint
    location /health {
        proxy_pass http://okypbot_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Okdesk webhook endpoint
    location /okdesk-webhook {
    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    
    proxy_pass http://okypbot_backend/okdesk-webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Okdesk-Signature $http_x_okdesk_signature;
    
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_max_temp_file_size 0;
    
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# Status page
location / {
    return 200 '{"status":"OkypBot webhook server","timestamp":"$time_iso8601"}';
    add_header Content-Type application/json;
}

}
