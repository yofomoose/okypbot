# Конфигурация для интеграции OkypBot с существующим nginx
# Добавьте этот блок в ваш основной nginx.conf или создайте отдельный файл в sites-enabled

upstream okypbot_backend {
    server localhost:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name okypbot.yourdomain.com;  # Измените на ваш домен
    
    # Логи для OkypBot
    access_log /var/log/nginx/okypbot_access.log;
    error_log /var/log/nginx/okypbot_error.log;
    
    # Health check endpoint
    location /health {
        proxy_pass http://okypbot_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check должен быть быстрым
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # Okdesk webhook endpoint
    location /okdesk-webhook {
        # Rate limiting для webhooks
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://okypbot_backend/okdesk-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Сохранение оригинальных заголовков для верификации webhook
        proxy_set_header X-Okdesk-Signature $http_x_okdesk_signature;
        
        # Таймауты для webhook
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Настройки буферизации для webhook payload
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_max_temp_file_size 0;
        
        # HTTP Keep-Alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Webhook статус (опционально)
    location / {
        return 200 '{"status":"OkypBot webhook server","timestamp":"$time_iso8601","server":"nginx"}';
        add_header Content-Type application/json;
    }
    
    # Блокировка всех остальных запросов
    location ~ ^/(?!health|okdesk-webhook) {
        return 404;
    }
}

# SSL конфигурация (если нужна)
server {
    listen 443 ssl http2;
    server_name okypbot.yourdomain.com;
    
    # SSL сертификаты (настройте по своему)
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Те же location блоки что и для HTTP
    include /etc/nginx/okypbot_locations.conf;
}
