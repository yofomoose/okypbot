server {
    listen 80;
    server_name _;

    # Simple health check
    location /health {
        access_log off;
        return 200 'OK';
    }

    # Forward webhook requests to bot
    location /okdesk-webhook {
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root response
    location / {
        return 200 'OkypBot webhook server';
    }
}
