server {
    listen 80;
    server_name _;

    # Simple health check
    location /health {
        proxy_pass http://okypbot:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Forward webhook requests to bot
    location /okdesk-webhook {
        proxy_pass http://okypbot:8001/okdesk-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # Увеличиваем таймаут для обработки длинных запросов
        client_max_body_size 10M;  # Разрешаем большие запросы
    }

    # Root response
    location / {
        proxy_pass http://okypbot:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
