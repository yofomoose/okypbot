# Default server configuration
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Access and error logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Webhook endpoint
    location /okdesk-webhook {
        # Rate limiting
        limit_req zone=webhook burst=20 nodelay;
        
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserve webhook headers
        proxy_set_header X-Okdesk-Signature $http_x_okdesk_signature;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Logging
        access_log /var/log/nginx/webhook.log combined;
    }

    # Root status page
    location / {
        add_header Content-Type application/json;
        return 200 '{"status":"OkypBot webhook server is running","timestamp":"$time_iso8601"}';
    }

    # Block other requests
    location ~ ^/(?!health|okdesk-webhook|$) {
        return 404;
    }
}
