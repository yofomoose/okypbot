# This file is intentionally empty as all server configurations
# are now in okypbot_locations.conf

# Just include the main configuration
include /etc/nginx/conf.d/okypbot_locations.conf;
        # Rate limiting for webhooks
        limit_req zone=webhook burst=20 nodelay;
        
        proxy_pass http://bot:8000/okdesk-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserve original headers for webhook verification
        proxy_set_header X-Okdesk-Signature $http_x_okdesk_signature;
        
        # Webhook timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings for webhook payloads
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Log webhook requests
        access_log /var/log/nginx/webhook.log main;
    }
    
    # Webhook documentation/status page (optional)
    location / {
        return 200 '{"status":"OkypBot webhook server is running","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # Block all other requests
    location ~ ^/(?!health|okdesk-webhook) {
        return 404;
    }
}
