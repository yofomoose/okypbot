# Добавьте в ваш существующий nginx.conf для n8n

# Upstream для okypbot
upstream okypbot_backend {
    server bot:8000;  # Если в одной сети Docker
    # или server IP_КОНТЕЙНЕРА:8000;
}

# Добавьте в server блок
server {
    listen 80;
    server_name ваш-домен.com;

    # n8n (существующие настройки)
    location /n8n/ {
        # ваши существующие настройки n8n
    }

    # OkypBot webhook
    location /okdesk-webhook {
        proxy_pass http://okypbot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Заголовки для webhook
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check для бота
    location /bot-health {
        proxy_pass http://okypbot_backend/health;
        proxy_set_header Host $host;
    }
}
