# PostgreSQL конфигурация для удаленного доступа

# Разрешить подключения с любых IP
listen_addresses = '*'

# Порт
port = 5432

# Максимум подключений
max_connections = 100

# Логирование
log_statement = 'all'
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Безопасность
ssl = off

# Память
shared_buffers = 128MB
effective_cache_size = 512MB
