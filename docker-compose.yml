version: '3.8'

services:
  # PostgreSQL база данных (если нет общей БД)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: okypbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5433:5432"  # Публичный порт для удаленного доступа
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - okypbot-net
      - n8n-net

  # Telegram бот
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OKDESK_API_TOKEN=${OKDESK_API_TOKEN}
      - OKDESK_BASE_URL=${OKDESK_BASE_URL}
      - OKDESK_WEBHOOK_SECRET=${OKDESK_WEBHOOK_SECRET}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=okypbot
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - WEBHOOK_ENABLED=true
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"  # Внутренний порт, без публикации наружу
    depends_on:
      - postgres
    restart: unless-stopped
    command: python main.py
    networks:
      - okypbot-net
      - n8n-net

volumes:
  postgres_data:

# Используем существующую сеть n8n + создаем свою
networks:
  n8n-net:
    external: true  # Подключаемся к существующей сети n8n
  okypbot-net:
    driver: bridge
